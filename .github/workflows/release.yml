name: Release APKs

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu çek
        uses: actions/checkout@v4

      - name: JDK 17 Kurulumu
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Kurulumu ve Önbellek
        uses: gradle/actions/setup-gradle@v4

      - name: gradlew çalıştırma izni
        run: chmod +x ./gradlew

      - name: Birim Testlerini Çalıştır
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Tüm Mimari APK Sürümlerini Derle (universal, arm64-v8a, armeabi-v7a, x86_64, x86)
        run: ./gradlew assembleRelease -PsplitAbis=true --no-daemon

      - name: APK Dosyalarını Sürüm Adıyla Hazırla
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-v2.0.0}"
          mkdir -p release-apks
          for apk in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$apk")
            if [[ "$base" == *"arm64-v8a"* ]]; then
              cp "$apk" "release-apks/UlgenTube-${TAG_NAME}-arm64-v8a.apk"
            elif [[ "$base" == *"armeabi-v7a"* ]]; then
              cp "$apk" "release-apks/UlgenTube-${TAG_NAME}-armeabi-v7a.apk"
            elif [[ "$base" == *"x86_64"* ]]; then
              cp "$apk" "release-apks/UlgenTube-${TAG_NAME}-x86_64.apk"
            elif [[ "$base" == *"x86"* ]]; then
              cp "$apk" "release-apks/UlgenTube-${TAG_NAME}-x86.apk"
            elif [[ "$base" == *"universal"* ]]; then
              cp "$apk" "release-apks/UlgenTube-${TAG_NAME}-universal.apk"
            fi
          done
          ls -lh release-apks/

      - name: GitHub Release Yayınla
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-apks/*.apk
